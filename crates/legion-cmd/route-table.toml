aliases = ["--required"]

[[routes.patterns]]
name = "blocking-flag"
kind = "flags"
policy = { policy = "blocklist", flags = ["jq", "json", "template", "web", "repo", "watch", "fail_fast", "interval", "required"] }
outcome = "deny"

[[routes.patterns]]
name = "number"
