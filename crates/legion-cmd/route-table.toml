capture = "n"
outcome = "rewrite"

[[routes]]
binary = "gh"
subcommand = "pr list"
positional_captures = []
equivalent = "legion pr list --repo {repo}"
reason = "unrecognized `gh pr list` shape"
guidance = "legion pr list --repo {repo}"

[[routes.patterns]]
name = "any-flag"
kind = "flags"
policy = { policy = "none" }
outcome = "deny"

[[routes.patterns]]
name = "clean"
kind = "no_extra_positionals"
outcome = "rewrite"

[[routes]]
