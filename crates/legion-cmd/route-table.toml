# `pr diff` is never a rewrite: legion pr view renders a PR's metadata and
# body, never diff content. No patterns at all -- always the route's own
# fallback deny below, on purpose, not merely unclassified.
[[routes]]
binary = "gh"
subcommand = "pr diff"
positional_captures = ["n"]
equivalent = "legion pr view --repo {repo} --number {n}"
reason = "`legion pr view` renders a PR's metadata and body -- never the diff content, so mapping `gh pr diff` to it would silently hand back something other than what was asked for"
guidance = "No legion command renders a PR's diff."

# --- Deny-only verbs: no lossless rewrite exists; each names its own
# `equivalent` in the fallback deny message. ---

[[routes]]
binary = "gh"
subcommand = "pr merge"
