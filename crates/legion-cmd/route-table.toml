# legion-cmd route table (NFR-CMD-005).
#
# POLICY AS DATA. Changing what a command does is an edit to this file, not a
# rewrite of a match arm. Every top-level section is present and named here
# even where slice 1 leaves it empty, so a later slice adds rows rather than
# inventing structure -- and so a missing section is a visible gap rather than
# a serde default nobody chose.
#
# `routes` is populated one rule module at a time by the thirteen slice-3
# issues (FR-CMD-005), no-gh first. Until then the table lists no binaries at
# all, and NFR-CMD-005's rule -- a binary not listed gates only the
# subcommands its routes name and Allows the rest -- means every call Allows.

# Binaries legion manages an equivalent for.
managed_binaries = ["gh"]

# Interpreters whose argument is opaque code (bash, python, node). A call
# through one of these is routed as opaque rather than parsed.
interpreters = []

# Binaries with no sanctioned use at all, gated whole rather than per-subcommand.
#
# `gh` has no bare pass-through (no-gh.sh, #1044): every subcommand either
# rewrites, denies by name, or -- for a shape no route lists -- denies
# pointing at the nearest group's help rather than Allowing silently.
fully_gated_binaries = ["gh"]

# Sanctioned escape hatches (FR-CMD-012). A reason-required escape is the
# point: an unexplained bypass is indistinguishable from an evasion.
#
# THIS MUST STAY ABOVE THE FIRST ARRAY-OF-TABLES SECTION BELOW (`wrappers`,
# then `group_help`) -- the same bare-key-under-a-preceding-array-of-tables
# footgun `routes` warns about further down: a bare key written after an
# `[[array_of_tables]]` header parses as a field of that array's LAST entry,
# not as a new top-level key, and is silently discarded.
escape_vocabulary = []

# Commands that wrap another command, seen through to the binary that
# actually runs (`env X=1 gh ...`, `sudo -u nobody gh ...`). Every wrapper
# the tokenizer's covered see-through set names (module doc, tokenizer.rs)
# needs `options_before_command = true` to be recognized at all --
# `resolve_binary_position` only skips past a name whose entry sets it, so a
# `false` entry is inert. #1117 (fixed in no-gh.sh, v0.38.0): a wrapper
# prefix reaching a managed binary without any shell metacharacter used to
# fall straight through this crate's tokenizer with `wrappers` empty, so
# `env X=1 gh pr view 1` matched no route at all and Allowed unaudited (#1044
# review, gate 01a06638-3d08). Populating this list is what lets `analyze`
# see through the prefix to `gh`'s real command position; `decide_stage`
# (router.rs) then refuses to rewrite or proxy a call whose `Matched` reports
# `wrapper_consumed` -- see that function for why Deny, never Proxy, is the
# only honest answer for a fully-gated binary reached this way.
[[wrappers]]
name = "env"
options_before_command = true

[[wrappers]]
name = "sudo"
options_before_command = true

[[wrappers]]
name = "timeout"
options_before_command = true

[[wrappers]]
name = "nice"
options_before_command = true

[[wrappers]]
name = "xargs"
options_before_command = true

[[wrappers]]
name = "command"
options_before_command = true

[[wrappers]]
name = "exec"
options_before_command = true

[[wrappers]]
name = "time"
options_before_command = true

# Where a binary's subcommand group documents itself, for guidance text --
# used by an unmatched subcommand under a known group (#1044).
[[group_help]]
binary = "gh"
group = "pr"
help_command = "legion pr --help"

[[group_help]]
binary = "gh"
group = "issue"
help_command = "legion issue --help"

[[group_help]]
binary = "gh"
group = "run"
help_command = "legion pr --help"

# One entry per routed subcommand.
#
# THIS MUST STAY ABOVE THE [defaults] HEADER. A TOML table consumes every bare
# key until the next header, so `routes` written below `[defaults]` parses as
# `defaults.routes` -- a key `Defaults` does not have. That is not a loud
# failure: the misplaced list is discarded and top-level `routes` quietly falls
# back to its serde default, so the table reports zero routes forever while the
# file appears to declare them.
#
# =========================================================================
# gh -- reproduces plugin/hooks/no-gh.sh's deny-or-rewrite set (#1044, the
# first of slice 3's thirteen module ports). `{repo}` binds from Ctx.repo at
# decide time (NFR-CMD-005); it is not a route-declared capture. `{n}` binds
# from the positional PR/issue number or its `--number` flag form.
# =========================================================================

[[routes]]
binary = "gh"
subcommand = "pr view"
positional_captures = ["n"]
equivalent = "legion pr view --repo {repo} --number {n}"
reason = "`gh pr view` with no PR number given -- legion has no branch-inferred default"
guidance = "legion pr view --repo {repo} --number <n>"

[[routes.flags]]
name = "number"
aliases = ["--number"]
takes_value = true
capture = "n"

[[routes.flags]]
name = "comments"
aliases = ["-c", "--comments"]

[[routes.flags]]
name = "jq"
aliases = ["-q", "--jq"]
takes_value = true

[[routes.flags]]
name = "json"
aliases = ["--json"]
takes_value = true

[[routes.flags]]
name = "template"
aliases = ["-t", "--template"]
takes_value = true

[[routes.flags]]
name = "web"
aliases = ["-w", "--web"]

[[routes.flags]]
name = "repo"
aliases = ["-R", "--repo"]
takes_value = true

[[routes.patterns]]
name = "blocking-flag"
kind = "flags"
policy = { policy = "blocklist", flags = ["comments", "jq", "json", "template", "web", "repo"] }
outcome = "deny"

[[routes.patterns]]
name = "number"
kind = "digits"
capture = "n"
outcome = "rewrite"

[[routes]]
binary = "gh"
subcommand = "pr checks"
positional_captures = ["n"]
equivalent = "legion pr checks --repo {repo} --number {n}"
reason = "`gh pr checks` with no PR number given"
guidance = "legion pr checks --repo {repo} --number <n>"

[[routes.flags]]
